<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste TV Kids</title>
</head>
<body style="background:#111; color:white; font-family:sans-serif; text-align:center; padding:15px; margin:0;">

  <h2 style="color:#ffcc00;">🇵🇹 TV Kids PT-PT</h2>

  <div style="margin-bottom:15px;">
    <button onclick="document.getElementById('yt').src='https://youtube.com'" style="padding:10px 15px; font-size:16px; border-radius:10px; background:#ffcc00; border:none; font-weight:bold;">🐼 Panda</button>
    <button onclick="document.getElementById('yt').src='https://youtube.com'" style="padding:10px 15px; font-size:16px; border-radius:10px; background:#00a859; color:white; border:none; font-weight:bold;">🎸 Idalécio</button>
  </div>

  <!-- Leitor com altura fixa garantida para iPhone -->
  <iframe id="yt"
    width="100%"
    height="300"
    src="https://youtube.com"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

</body>
</html>
