<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Kids PT-PT v2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background-color: #1f1f1f;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ffcc00;
    }
    h1 { font-size: 16px; margin: 0; color: #ffcc00; }
    .canais {
      display: flex;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
      background: #1a1a1a;
    }
    button {
      background-color: #2c2c2c;
      color: white;
      border: 2px solid #444;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }
    button.ativo {
      background-color: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }
    #player-box {
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .controles {
      padding: 12px;
      display: flex;
      justify-content: center;
      background: #1f1f1f;
    }
    .btn-next {
      background-color: #00a859;
      border-color: #00a859;
      font-size: 16px;
      padding: 12px 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🇵🇹 TV Kids PT-PT</h1>
    <span style="font-size: 12px; color: #00a859;">● Versão 2</span>
  </header>

  <div class="canais">
    <button class="ativo" onclick="selecionarCanal('panda', this)">🐼 Panda e os Caricas</button>
    <button onclick="selecionarCanal('idalecio', this)">🎸 Prof. Idalécio</button>
    <button onclick="selecionarCanal('nina', this)">🎀 Nina Toc Toc</button>
  </div>

  <div id="player-box">
    <iframe id="video-frame"
      src="https://youtube-nocookie.com"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="controles">
    <button class="btn-next" onclick="proximoVideo()">⏭️ Próximo Vídeo</button>
  </div>

  <script>
    // Listas fechadas de IDs de vídeos oficiais em PT-PT
    const listas = {
      panda: [
        '761ae_KDg_Q', // Panda e os Caricas - Sou uma Taça
        'yM96pS2S2-U', // Panda e os Caricas - Pinguim
        '1X2t7t5wS9A', // Panda e os Caricas - A Loja do Mestre André
        'R_M-7X2N6G4'  // Panda e os Caricas - Dona Aranha
      ],
      idalecio: [
        'b-S8u1p62aA', // Prof. Idalécio - O Comboio
        'g-u4vR-n1A8', // Prof. Idalécio - Canções infantis
        'kX8c0J9vN3M'  // Prof. Idalécio - Música PT
      ],
      nina: [
        'q3K5d2N8wL4', // Nina Toc Toc - Canção
        'm9P4v7R2xQ1'  // Nina Toc Toc - Infantil PT
      ]
    };

    let canalAtual = 'panda';
    let indice = 0;

    function selecionarCanal(canal, botao) {
      document.querySelectorAll('.canais button').forEach(b => b.classList.remove('ativo'));
      botao.classList.add('ativo');
      canalAtual = canal;
      indice = 0;
      carregarVideo();
    }

    function proximoVideo() {
      indice = (indice + 1) % listas[canalAtual].length;
      carregarVideo();
    }

    function carregarVideo() {
      const videoId = listas[canalAtual][indice];
      const frame = document.getElementById('video-frame');
      frame.src = `https://youtube-nocookie.com{videoId}?autoplay=1&rel=0&playsinline=1`;
    }
  </script>
</body>
</html>
