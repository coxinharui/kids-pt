<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>TV Kids PT-PT v5</title>
</head>
<body style="background:#111; color:white; font-family:sans-serif; margin:0; padding:15px; text-align:center;">

  <h2 style="color:#ffcc00; margin-top:0;">🇵🇹 TV Kids PT-PT (v5)</h2>

  <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:15px;">
    <button onclick="mudar('ybN2N_hAf1M')" style="padding:10px; border-radius:10px; background:#ffcc00; border:none; font-weight:bold;">🐼 Panda</button>
    <button onclick="mudar('iezjtKchChE')" style="padding:10px; border-radius:10px; background:#00a859; color:white; border:none; font-weight:bold;">🎸 Idalécio</button>
    <button onclick="mudar('DROBhivPdz4')" style="padding:10px; border-radius:10px; background:#e91e63; color:white; border:none; font-weight:bold;">🎀 Nina</button>
    <button onclick="mudar('M7lc1UVf-VE')" style="padding:10px; border-radius:10px; background:#2196f3; color:white; border:none; font-weight:bold;">🧪 Teste YouTube</button>
  </div>

  <div style="width:100%; max-width:600px; margin:0 auto; aspect-ratio:16/9; background:#222; border:2px solid #444;">
    <iframe id="player"
      style="width:100%; height:100%; border:0;"
      src="https://youtube.com"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <p id="status" style="color:#aaa; font-size:13px; margin-top:10px;">A mostrar: Vídeo de Teste Oficial</p>

  <script>
    function mudar(id) {
      document.getElementById('player').src = 'https://youtube.com' + id + '?autoplay=1&playsinline=1';
      document.getElementById('status').innerText = 'A carregar vídeo ID: ' + id;
    }
  </script>
</body>
</html>
