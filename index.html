<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Kids PT-PT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      background-color: #1f1f1f;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ffcc00;
    }
    h1 { font-size: 16px; margin: 0; color: #ffcc00; }
    .canais {
      display: flex;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
      background: #1a1a1a;
      -webkit-overflow-scrolling: touch;
    }
    button {
      background-color: #2c2c2c;
      color: white;
      border: 2px solid #444;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    button.ativo {
      background-color: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }
    #player-box {
      flex: 1;
      width: 100%;
      background: #000;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .controles {
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      background: #1f1f1f;
    }
    .btn-next {
      background-color: #00a859;
      border-color: #00a859;
      font-size: 16px;
      padding: 12px 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🇵🇹 TV Kids PT-PT</h1>
    <span style="font-size: 12px; color: #00a859;">● Canais Reais</span>
  </header>

  <div class="canais">
    <button class="ativo" onclick="selecionarCanal('panda', this)">🐼 Panda e os Caricas</button>
    <button onclick="selecionarCanal('idalecio', this)">🎸 Prof. Idalécio</button>
    <button onclick="selecionarCanal('nina', this)">🎀 Nina Toc Toc</button>
    <button onclick="selecionarCanal('vkids', this)">🐥 V Kids</button>
  </div>

  <div id="player-box">
    <iframe id="video-frame"
      src="https://youtube.com"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="controles">
    <button class="btn-next" onclick="proximoVideo()">⏭️ Próximo Vídeo</button>
  </div>

  <script>
    // IDs reais verificados dos canais oficiais PT-PT
    const listas = {
      panda: [
        'ybN2N_hAf1M', // Panda e os Caricas - Dança Panda
        'enLZo_rALI4', // Panda e os Caricas - Em Festa
        'CFZkJYFgwXI'  // Panda e os Caricas - Sem Parar
      ],
      idalecio: [
        'iezjtKchChE'  // Prof. Idalécio - Vamos Aprender!
      ],
      nina: [
        'DROBhivPdz4', // Nina Toc Toc - Nina Toc Toc
        'l8GmoZ1ZKKw'  // Nina Toc Toc - Dança Das Letras
      ],
      vkids: [
        'ys-sWvIlxzE'  // V Kids (Vidisco Kids) - Vídeos Infantis PT
      ]
    };

    let canalAtual = 'panda';
    let indice = 0;

    function selecionarCanal(canal, botao) {
      document.querySelectorAll('.canais button').forEach(b => b.classList.remove('ativo'));
      botao.classList.add('ativo');
      canalAtual = canal;
      indice = 0;
      carregarVideo();
    }

    function proximoVideo() {
      indice = (indice + 1) % listas[canalAtual].length;
      carregarVideo();
    }

    function carregarVideo() {
      const videoId = listas[canalAtual][indice];
      const frame = document.getElementById('video-frame');
      frame.src = `https://youtube.com{videoId}?autoplay=1&rel=0&playsinline=1&hl=pt-PT`;
    }
  </script>
</body>
</html>
